{% extends "base.html" %}
{% block page_title %}账号管理{% endblock %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <input type="text" id="kw" placeholder="搜索账号/姓名" style="width:200px">
    <button class="btn btn-outline" onclick="loadList()">查询</button>
    <div class="spacer"></div>
    <button class="btn btn-outline" onclick="openClassPool()">班级库</button>
    <button class="btn btn-primary" onclick="openEdit()">＋ 新增账号</button>
  </div>
  <div id="list-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// ROLE_NAME 已在 base.html 全局定义，此处不可重复声明（const 重复声明会使整个脚本块失效）
let classPool = [];
let usersCache = [];

async function onPageReady() {
  document.getElementById("kw").addEventListener("keydown", e => { if (e.key === "Enter") loadList(); });
  await Promise.all([loadList(), getClassPool()]);
}

async function getClassPool(force = false) {
  if (!force && classPool.length) return classPool;
  classPool = await api("/api/classes");
  return classPool;
}

function splitClasses(raw) {
  return (raw || "").split(/[,，、]/).map(s => s.trim()).filter(Boolean);
}

function encClass(name) {
  return encodeURIComponent(name).replace(/'/g, "%27");
}

function classTags(r) {
  const names = splitClasses(r.classes);
  if (!names.length) return '<span style="color:var(--text-muted)">未绑定</span>';
  return '<div class="class-tags">' + names.map(c =>
    `<span class="class-tag">${esc(c)}<button type="button" class="class-tag-x" title="解绑" onclick="unbindClass(${r.id}, '${encClass(c)}')">×</button></span>`
  ).join("") + "</div>";
}

async function loadList() {
  const kw = document.getElementById("kw").value;
  usersCache = await api("/api/users" + (kw ? "?kw=" + encodeURIComponent(kw) : ""));
  const cols = [
    { title: "账号", key: "username" },
    { title: "姓名", key: "name" },
    { title: "角色", render: r => `<span class="badge badge-${r.role === "teacher" ? "blue" : "green"}">${ROLE_NAME[r.role] || r.role}</span>` },
    { title: "联系电话", render: r => esc(r.phone || "-") },
    { title: "任教班级", render: classTags },
    { title: "创建时间", key: "created_at" },
    { title: "操作", render: r => `
      ${r.role === "teacher" ? `<button class="btn btn-outline btn-sm" onclick="openBind(${r.id})">绑定班级</button>` : ""}
      <button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(r)})'>编辑</button>
      ${r.username === "admin"
        ? '<span class="badge badge-gray">内置账号</span>'
        : `<button class="btn btn-danger btn-sm" onclick="del(${r.id},'${esc(r.username)}')">删除</button>`}` },
  ];
  renderTable("list-box", cols, usersCache);
}

function classPickerHtml(pool, current) {
  return `<div class="class-picker">` + pool.map(n =>
    `<label class="class-check"><input type="checkbox" value="${esc(n)}" ${current.includes(n) ? "checked" : ""}><span>${esc(n)}</span></label>`
  ).join("") + `</div>`;
}

function pickerValues() {
  return Array.from(document.querySelectorAll(".class-picker input:checked")).map(el => el.value);
}

async function openBind(uid) {
  const u = usersCache.find(x => x.id === uid);
  if (!u) return;
  await getClassPool();
  const current = splitClasses(u.classes);
  const legacy = current.filter(c => !classPool.includes(c));
  openModal(`绑定班级 · ${esc(u.name)}`, `
    ${classPickerHtml(classPool, current)}
    <div style="margin-top:10px;font-size:12px;color:var(--text-muted)">勾选并保存即绑定，取消勾选即解绑。</div>
    ${legacy.length ? `<div style="margin-top:6px;font-size:12px;color:var(--text-muted)">旧班级：${legacy.map(esc).join("、")}（可在列表中点 × 解绑）</div>` : ""}
  `, { onOk: async () => {
    const names = pickerValues().concat(legacy);
    await api(`/api/users/${uid}/classes`, { method: "PUT", body: { classes: names } });
    toast("保存成功"); closeModal(); await loadList();
  }});
}

function unbindClass(uid, nameEnc) {
  const name = decodeURIComponent(nameEnc);
  const u = usersCache.find(x => x.id === uid);
  if (!u) return;
  openModal("确认解绑", `<p>确定将「${esc(name)}」从 ${esc(u.name)} 的任教班级中解绑吗？</p>`, {
    onOk: async () => {
      const remain = splitClasses(u.classes).filter(c => c !== name);
      await api(`/api/users/${uid}/classes`, { method: "PUT", body: { classes: remain } });
      toast("已解绑 " + name); closeModal(); await loadList();
    }
  });
}

async function openClassPool() {
  const pool = await getClassPool(true);
  openModal("班级库维护", `
    <div class="form-group"><label>班级列表（每行一个，建议每两年手动更新一次）</label>
      <textarea id="cp-names" rows="14" style="font-family:Consolas,monospace">${esc(pool.join("\n"))}</textarea></div>
    <div style="font-size:12px;color:var(--text-muted)">更新后，被移除的班级会自动从相关教师的任教班级中解绑。</div>
  `, { onOk: async () => {
    const names = formVal("cp-names").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    if (!names.length) { toast("班级库不能为空", "error"); return; }
    const data = await api("/api/classes", { method: "PUT", body: { classes: names } });
    toast(`班级库已更新，共 ${data.count} 个班级` + (data.unbound ? `，${data.unbound} 位教师已自动解绑` : ""));
    closeModal(); classPool = []; await getClassPool(); await loadList();
  }});
}

async function openEdit(item) {
  const u = item || {};
  await getClassPool();
  const current = splitClasses(u.classes);
  const legacy = current.filter(c => !classPool.includes(c));
  const role = u.role || "teacher";
  openModal(item ? "编辑账号" : "新增账号", `
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>账号 <span class="req">*</span></label>
        <input type="text" id="us-username" value="${esc(u.username || "")}" ${item ? "disabled" : ""}></div>
      <div class="form-group" style="flex:1"><label>姓名 <span class="req">*</span></label>
        <input type="text" id="us-name" value="${esc(u.name || "")}"></div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>角色</label>
        <select id="us-role">
          <option value="teacher" ${role === "teacher" ? "selected" : ""}>生物教师</option>
          <option value="admin" ${role === "admin" ? "selected" : ""}>实验管理员</option>
          <option value="sysadmin" ${role === "sysadmin" ? "selected" : ""}>系统管理员</option>
        </select></div>
      <div class="form-group" style="flex:1"><label>联系电话</label><input type="text" id="us-phone" value="${esc(u.phone || "")}"></div>
    </div>
    <div class="form-group" id="us-classes-wrap" style="${role === "teacher" ? "" : "display:none"}">
      <label>任教班级（可多选）</label>
      ${classPickerHtml(classPool, current)}
      ${legacy.length ? `<div style="font-size:12px;color:var(--text-muted)">旧班级：${legacy.map(esc).join("、")}（可在列表中解绑）</div>` : ""}
    </div>
    <div class="form-group"><label>${item ? "重置密码（留空不修改）" : "初始密码 *"}</label>
      <input type="password" id="us-password" placeholder="${item ? "留空则保持原密码" : "至少6位"}"></div>
  `, {
    onOpen: () => {
      document.getElementById("us-role").addEventListener("change", e => {
        document.getElementById("us-classes-wrap").style.display = e.target.value === "teacher" ? "" : "none";
      });
    },
    onOk: async () => {
      const body = { name: formVal("us-name"), role: formVal("us-role"), phone: formVal("us-phone"),
        password: formVal("us-password") };
      let uid;
      if (item) {
        const saved = await api(`/api/users/${item.id}`, { method: "PUT", body });
        uid = saved.id;
      } else {
        body.username = formVal("us-username");
        if (!body.username || !body.password) { toast("账号和密码不能为空", "error"); return; }
        uid = (await api("/api/users", { method: "POST", body })).id;
      }
      if (body.role === "teacher") {
        const names = pickerValues().concat(legacy);
        await api(`/api/users/${uid}/classes`, { method: "PUT", body: { classes: names } });
      }
      toast("保存成功"); closeModal(); await loadList();
    }
  });
}

function del(id, username) {
  openModal("确认删除", `<p>确定删除账号「${esc(username)}」吗？</p>`, { onOk: async () => {
    await api(`/api/users/${id}`, { method: "DELETE" });
    toast("删除成功"); closeModal(); await loadList();
  }});
}
</script>
{% endblock %}
