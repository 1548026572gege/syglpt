{% extends "base.html" %}
{% block page_title %}实验登记与报告{% endblock %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <input type="text" id="kw" placeholder="搜索实验名称" style="width:200px">
    <button class="btn btn-outline" onclick="loadList()">查询</button>
    <div class="spacer"></div>
    <button class="btn btn-outline" onclick="openImport()">⬆ Excel 导入</button>
    <button class="btn btn-outline" onclick="downloadFile('/api/reports/export')">⬇ 导出 Excel</button>
    <button class="btn btn-outline" onclick="printAll()">🖨 打印全部</button>
    <button class="btn btn-primary" onclick="openEdit()">＋ 实验使用登记</button>
  </div>
  <div id="list-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
let myReservations = [];
let reportList = [];

async function onPageReady() {
  try { myReservations = await api("/api/reports/my-reservations"); } catch (e) { myReservations = []; }
  document.getElementById("kw").addEventListener("keydown", e => { if (e.key === "Enter") loadList(); });
  await loadList();
}

async function loadList() {
  const kw = document.getElementById("kw").value;
  reportList = await api("/api/reports" + (kw ? "?kw=" + encodeURIComponent(kw) : ""));
  const list = reportList;
  const cols = [
    { title: "实验名称", key: "experiment_name" },
    { title: "教师", key: "teacher_name" },
    { title: "实际使用时间", render: r => r.actual_time || "-" },
    { title: "班级", render: r => esc(r.class_name || "-") },
    { title: "分组情况", render: r => esc(r.group_info || "-") },
    { title: "登记时间", key: "created_at" },
    { title: "附件", render: r => r.attachment ? `<a href="/uploads/${r.attachment}" target="_blank" style="color:var(--info)">查看</a>` : "-" },
    { title: "操作", render: r => opBtns(r) },
  ];
  renderTable("list-box", cols, list);
}

function opBtns(r) {
  const mine = r.teacher_id === getUser().id;
  return `
    <button class="btn btn-outline btn-sm" onclick="viewReport(${r.id})">详情</button>
    <button class="btn btn-outline btn-sm" onclick='printOne(${JSON.stringify(r)})'>打印</button>
    ${(mine || isAdmin()) ? `
      <button class="btn btn-outline btn-sm" onclick="editReport(${r.id})">编辑</button>
      <button class="btn btn-outline btn-sm" onclick="downloadFile('/api/reports/${r.id}/export')">导出报告单</button>
      <button class="btn btn-outline btn-sm" onclick="openUpload(${r.id})">上传附件</button>
      <button class="btn btn-danger btn-sm" onclick="del(${r.id})">删除</button>` : ""}`;
}

function reportFormHtml(r, reservations) {
  return `
    <div class="form-group"><label>关联预约</label>
      <select id="rp-rv"><option value="">不关联</option>
        ${reservations.map(v => `<option value="${v.id}" ${r.reservation_id === v.id ? "selected" : ""}>${esc(v.experiment_name)}（${esc(v.start_time)}）</option>`).join("")}</select></div>
    <div class="form-group"><label>实验名称 <span class="req">*</span></label><input type="text" id="rp-name" value="${esc(r.experiment_name || "")}"></div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>实际使用时间</label><input type="datetime-local" id="rp-time" value="${r.actual_time ? r.actual_time.replace(" ", "T") : ""}"></div>
      <div class="form-group" style="flex:1"><label>参与班级</label><input type="text" id="rp-class" value="${esc(r.class_name || "")}"></div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>分组情况</label><input type="text" id="rp-group" value="${esc(r.group_info || "")}" placeholder="如：12组，每组4人"></div>
      <div class="form-group" style="flex:1"><label>使用仪器</label><input type="text" id="rp-ins" value="${esc(r.instruments_used || "")}" placeholder="如：显微镜20台、载玻片50片"></div>
    </div>
    <div class="form-group"><label>实验内容与过程</label><textarea id="rp-content" rows="3">${esc(r.content || "")}</textarea></div>
    <div class="form-group"><label>实验结果</label><textarea id="rp-result" rows="3">${esc(r.result || "")}</textarea></div>
    <div class="form-group"><label>异常情况</label><textarea id="rp-exception" rows="2">${esc(r.exception || "")}</textarea></div>`;
}

function reportBody() {
  return {
    reservation_id: formVal("rp-rv") || null, experiment_name: formVal("rp-name"),
    actual_time: formVal("rp-time"), class_name: formVal("rp-class"),
    group_info: formVal("rp-group"), instruments_used: formVal("rp-ins"),
    content: formVal("rp-content"), result: formVal("rp-result"), exception: formVal("rp-exception"),
  };
}

function openEdit() {
  openModal("实验使用登记", reportFormHtml({}, myReservations), { large: true, onOk: async () => {
    await api("/api/reports", { method: "POST", body: reportBody() });
    toast("登记成功"); closeModal(); loadList();
  }, onOpen: () => {
    document.getElementById("rp-rv").onchange = e => {
      const v = myReservations.find(x => x.id == e.target.value);
      if (v) {
        document.getElementById("rp-name").value = v.experiment_name || "";
        document.getElementById("rp-class").value = v.class_name || "";
        if (v.start_time) document.getElementById("rp-time").value = v.start_time.replace(" ", "T");
      }
    };
  }});
}

async function editReport(id) {
  const r = await api(`/api/reports/${id}`);
  openModal("编辑实验报告", reportFormHtml(r, myReservations), { large: true, onOk: async () => {
    await api(`/api/reports/${id}`, { method: "PUT", body: reportBody() });
    toast("保存成功"); closeModal(); loadList();
  }});
}

async function viewReport(id) {
  const r = await api(`/api/reports/${id}`);
  openModal("实验报告详情", `
    <dl class="desc-list">
      <dt>实验名称</dt><dd>${esc(r.experiment_name)}</dd>
      <dt>任课教师</dt><dd>${esc(r.teacher_name)}</dd>
      <dt>实验时间</dt><dd>${esc(r.actual_time || "-")}</dd>
      <dt>参与班级</dt><dd>${esc(r.class_name || "-")}</dd>
      <dt>分组情况</dt><dd>${esc(r.group_info || "-")}</dd>
      <dt>使用仪器</dt><dd>${esc(r.instruments_used || "-")}</dd>
      <dt>实验内容</dt><dd>${esc(r.content || "-")}</dd>
      <dt>实验结果</dt><dd>${esc(r.result || "-")}</dd>
      <dt>异常情况</dt><dd>${esc(r.exception || "无")}</dd>
      ${r.attachment ? `<dt>附件</dt><dd><a href="/uploads/${r.attachment}" target="_blank" style="color:var(--info)">${esc(r.attachment)}</a></dd>` : ""}
    </dl>`, { large: true, hideFooter: true });
}

function openUpload(id) {
  openModal("上传报告附件", `
    <p style="margin-bottom:10px;color:var(--text-muted)">支持 pdf / word / excel / 图片 / zip，不超过 16MB。</p>
    <input type="file" id="up-file">
  `, { onOk: async () => {
    const f = document.getElementById("up-file").files[0];
    if (!f) { toast("请选择文件", "error"); return; }
    const fd = new FormData(); fd.append("file", f);
    const resp = await fetch(`/api/reports/${id}/attachment`, { method: "POST",
      headers: { "Authorization": "Bearer " + getToken() }, body: fd });
    const data = await resp.json();
    if (data.code !== 0) { toast(data.msg || "上传失败", "error"); return; }
    toast("附件上传成功"); closeModal(); loadList();
  }});
}

function del(id) {
  openModal("确认删除", `<p>确定删除该实验报告吗？</p>`, { onOk: async () => {
    await api(`/api/reports/${id}`, { method: "DELETE" });
    toast("删除成功"); closeModal(); loadList();
  }});
}

// ---------------- Excel 批量导入 ----------------
function openImport() {
  openModal("批量导入实验报告", `
    <p style="margin-bottom:10px;color:var(--text-muted)">两种方式任选：① 下载模板填写后上传；② 直接上传自行整理的 Excel，系统按表头列名自动识别（列顺序不限，需包含"实验名称"列）。</p>
    <p style="margin-bottom:12px"><a href="javascript:downloadFile('/api/reports/import-template')" style="color:var(--primary)">⬇ 下载导入模板</a></p>
    <input type="file" id="imp-file" accept=".xlsx,.xlsm">
  `, { onOk: async () => {
    const f = document.getElementById("imp-file").files[0];
    if (!f) { toast("请选择文件", "error"); return; }
    const fd = new FormData(); fd.append("file", f);
    const resp = await fetch("/api/reports/import", { method: "POST",
      headers: { "Authorization": "Bearer " + getToken() }, body: fd });
    const data = await resp.json();
    if (data.code !== 0) { toast(data.msg || "导入失败", "error"); return; }
    closeModal();
    const errs = (data.data.errors || []);
    openModal("导入结果", `<p>${esc(data.msg)}</p>` +
      (errs.length ? `<ul style="margin-top:10px;color:var(--warning);font-size:13px">${errs.map(e => `<li>${esc(e)}</li>`).join("")}</ul>` : ""),
      { hideFooter: true });
    loadList();
  }});
}

// ---------------- 打印 ----------------
const truncT = (s, n = 60) => { s = s || ""; return s.length > n ? s.slice(0, n) + "…" : s; };
const escBr = s => esc(s || "").replace(/\n/g, "<br>");

function printWindow(inner, filename) {
  const w = window.open("", "_blank", "width=960,height=720");
  if (!w) { toast("浏览器拦截了打印窗口，请允许弹出窗口", "error"); return; }
  w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${filename}</title></head><body>${inner}</body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

const printStyle = `
  <style>
    body { font-family: SimSun, serif; color: #000; }
    h2 { text-align: center; margin-bottom: 4px; }
    .sub { text-align: center; font-size: 13px; margin-bottom: 14px; color: #333; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { border: 1px solid #000; padding: 8px 10px; vertical-align: top; }
    th { background: #f0f0f0; }
    .lab { width: 110px; background: #f0f0f0; text-align: center; white-space: nowrap; }
    .meta { margin-top: 14px; font-size: 13px; display: flex; justify-content: space-between; }
  </style>`;

function reportSheet(r) {
  return `
    <h2>生 物 实 验 报 告 单</h2>
    <div class="sub">Experiment Report</div>
    <table>
      <tr><td class="lab">实验名称</td><td>${esc(r.experiment_name || "-")}</td>
          <td class="lab">任课教师</td><td>${esc(r.teacher_name || "-")}</td></tr>
      <tr><td class="lab">实验时间</td><td>${esc(r.actual_time || "-")}</td>
          <td class="lab">参与班级</td><td>${esc(r.class_name || "-")}</td></tr>
      <tr><td class="lab">分组情况</td><td>${esc(r.group_info || "-")}</td>
          <td class="lab">使用仪器</td><td>${esc(r.instruments_used || "-")}</td></tr>
      <tr><td class="lab">实验内容与过程</td><td colspan="3" style="height:90px">${escBr(r.content) || "&nbsp;"}</td></tr>
      <tr><td class="lab">实验结果</td><td colspan="3" style="height:70px">${escBr(r.result) || "&nbsp;"}</td></tr>
      <tr><td class="lab">异常情况</td><td colspan="3" style="height:50px">${escBr(r.exception) || "无"}</td></tr>
    </table>`;
}

function printOne(r) {
  printWindow(printStyle + reportSheet(r) +
    `<div class="meta"><span>任课教师（签字）：__________</span><span>实验管理员（签字）：__________</span><span>日期：__________</span></div>`,
    `实验报告单-${r.experiment_name}`);
}

function printAll() {
  if (!reportList.length) { toast("暂无数据可打印", "error"); return; }
  const rows = reportList.map((r, i) => `
    <tr>
      <td style="text-align:center">${i + 1}</td>
      <td>${esc(r.experiment_name)}</td><td>${esc(r.teacher_name || "-")}</td>
      <td>${esc(r.actual_time || "-")}</td><td>${esc(r.class_name || "-")}</td>
      <td>${esc(r.group_info || "-")}</td>
      <td>${escBr(truncT(r.content)) || "&nbsp;"}</td>
      <td>${escBr(truncT(r.result)) || "&nbsp;"}</td>
    </tr>`).join("");
  const inner = printStyle + `
    <h2>实验报告汇总表</h2>
    <div class="sub">共 ${reportList.length} 条 · 打印时间 ${new Date().toLocaleString()}</div>
    <table>
      <tr><th>序号</th><th>实验名称</th><th>任课教师</th><th>实验时间</th>
          <th>参与班级</th><th>分组情况</th><th>实验内容与过程</th><th>实验结果</th></tr>
      ${rows}
    </table>`;
  printWindow(inner, "实验报告汇总表");
}
</script>
{% endblock %}
