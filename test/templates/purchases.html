{% extends "base.html" %}
{% block page_title %}仪器采购申报{% endblock %}
{% block content %}
<div class="card">
  <div class="toolbar">
    <select id="f-status">
      <option value="">全部状态</option>
      <option>草稿</option><option>已提交</option><option>已审批</option><option>已驳回</option><option>已采购</option><option>已入库</option>
    </select>
    <button class="btn btn-outline" onclick="loadList()">查询</button>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="openEdit()">＋ 新建采购申请</button>
  </div>
  <div id="list-box"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function onPageReady() { await loadList(); }

async function loadList() {
  const status = document.getElementById("f-status").value;
  const list = await api("/api/purchases" + (status ? "?status=" + encodeURIComponent(status) : ""));
  const cols = [
    { title: "仪器名称", key: "instrument_name" },
    { title: "分类代码", render: r => esc(r.category_code || "-") },
    { title: "型号", render: r => esc(r.model || "-") },
    { title: "数量", key: "quantity" },
    { title: "预算(元)", render: r => r.budget ?? "-" },
    { title: "申请理由", render: r => esc(r.reason || "-") },
    { title: "申请人", key: "applicant_name" },
    { title: "申请时间", key: "created_at" },
    { title: "状态", render: r => badge(r.status) + (r.review_comment ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${esc(r.review_comment)}</div>` : "") },
    { title: "操作", render: r => opBtns(r) },
  ];
  renderTable("list-box", cols, list);
}

function opBtns(r) {
  const btns = [];
  const mine = r.applicant_id === getUser().id;
  if (r.status === "草稿" && (mine || isAdmin())) {
    btns.push(`<button class="btn btn-outline btn-sm" onclick='openEdit(${JSON.stringify(r)})'>编辑</button>`);
    btns.push(`<button class="btn btn-primary btn-sm" onclick="changeStatus(${r.id},'已提交')">提交</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" onclick="del(${r.id})">删除</button>`);
  }
  if (r.status === "已提交" && isAdmin()) {
    btns.push(`<button class="btn btn-primary btn-sm" onclick="openReview(${r.id},'已审批')">审批通过</button>`);
    btns.push(`<button class="btn btn-danger btn-sm" onclick="openReview(${r.id},'已驳回')">驳回</button>`);
  }
  if (r.status === "已驳回" && (mine || isAdmin())) {
    btns.push(`<button class="btn btn-danger btn-sm" onclick="del(${r.id})">删除</button>`);
  }
  if (r.status === "已审批" && isAdmin()) {
    btns.push(`<button class="btn btn-primary btn-sm" onclick="changeStatus(${r.id},'已采购')">标记已采购</button>`);
  }
  if (r.status === "已采购" && isAdmin()) {
    btns.push(`<button class="btn btn-primary btn-sm" onclick='openReceive(${JSON.stringify(r)})'>入库到台账</button>`);
  }
  if (r.status === "已入库") {
    btns.push(`<span style="color:var(--text-muted);font-size:12px">已入库</span>`);
  }
  return btns.join(" ") || "-";
}

function openEdit(item) {
  const p = item || {};
  openModal(item ? "编辑采购申请" : "新建采购申请", `
    <div class="form-row">
      <div class="form-group" style="flex:2;min-width:220px">
        <label>仪器名称 <span class="req">*</span></label>
        <div class="ac-wrap">
          <input type="text" id="pc-name" autocomplete="off" placeholder="输入关键字搜索配备目录，也可手动输入" value="${esc(p.instrument_name || "")}">
          <div class="ac-list" id="pc-name-ac"></div>
        </div>
        <div class="form-hint" id="pc-name-hint">输入关键字会从仪器配备目录中匹配，选中后自动填充分类代码</div>
      </div>
      <div class="form-group" style="flex:1;min-width:150px">
        <label>分类代码</label>
        <input type="text" id="pc-code" placeholder="选择仪器后自动填充" value="${esc(p.category_code || "")}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>型号</label><input type="text" id="pc-model" value="${esc(p.model || "")}"></div>
      <div class="form-group" style="flex:1"><label>数量</label><input type="number" id="pc-qty" min="1" value="${p.quantity || 1}"></div>
      <div class="form-group" style="flex:1"><label>预算（元）</label><input type="number" id="pc-budget" min="0" step="0.01" value="${p.budget || 0}"></div>
    </div>
    <div class="form-group"><label>申请理由</label><textarea id="pc-reason" placeholder="如：现有显微镜数量不足，无法满足分组实验">${esc(p.reason || "")}</textarea></div>
    <div class="form-group"><label>保存方式</label>
      <select id="pc-submit"><option value="">存为草稿</option><option value="1">直接提交申报</option></select></div>
  `, { onOpen: () => pcInitAutocomplete(p.instrument_name || ""), onOk: async () => {
    const body = {
      instrument_name: formVal("pc-name"), category_code: formVal("pc-code"),
      model: formVal("pc-model"),
      quantity: Number(formVal("pc-qty")) || 1, budget: Number(formVal("pc-budget")) || 0,
      reason: formVal("pc-reason"), submit: !!formVal("pc-submit"),
    };
    if (item) {
      await api(`/api/purchases/${item.id}`, { method: "PUT", body });
      if (body.submit) await api(`/api/purchases/${item.id}`, { method: "PUT", body: { status: "已提交" } });
    } else {
      await api("/api/purchases", { method: "POST", body });
    }
    toast("保存成功"); closeModal(); loadList();
  }});
}

/* ---------- 仪器名称自动补全（数据来源：仪器配备目录） ---------- */
let pcAcResults = [];
let pcAcTimer = null;
let pcAcSeq = 0;
let pcAcIndex = -1;
let pcPickedName = "";
let pcAutoCode = "";

function pcInitAutocomplete(selectedName) {
  const input = document.getElementById("pc-name");
  const box = document.getElementById("pc-name-ac");
  if (!input || !box) return;
  pcAcResults = [];
  pcAcIndex = -1;
  pcPickedName = selectedName || "";
  pcAutoCode = "";

  input.addEventListener("input", () => {
    const kw = input.value.trim();
    if (pcPickedName && kw !== pcPickedName) {
      const codeEl = document.getElementById("pc-code");
      if (codeEl && pcAutoCode && codeEl.value === pcAutoCode) codeEl.value = "";
      pcPickedName = "";
      pcAutoCode = "";
    }
    clearTimeout(pcAcTimer);
    if (!kw) { pcAcHide(); return; }
    pcAcTimer = setTimeout(() => pcAcSearch(kw), 250);
  });

  input.addEventListener("keydown", e => {
    if (!box.classList.contains("show")) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      pcAcMove(e.key === "ArrowDown" ? 1 : -1);
    } else if (e.key === "Enter" && pcAcIndex >= 0) {
      e.preventDefault();
      pcAcSelect(pcAcIndex);
    } else if (e.key === "Escape") {
      pcAcHide();
    }
  });

  input.addEventListener("blur", () => setTimeout(pcAcHide, 150));

  const pick = e => {
    const el = e.target.closest(".ac-item");
    if (!el) return;
    e.preventDefault();
    pcAcSelect(Number(el.dataset.idx));
  };
  box.addEventListener("mousedown", pick);
  box.addEventListener("click", pick);

  if (selectedName && document.getElementById("pc-code").value) {
    pcHint("已保存的分类代码，可在输入框内手动修改");
  }
}

async function pcAcSearch(kw) {
  const seq = ++pcAcSeq;
  try {
    const data = await api("/api/catalog?kw=" + encodeURIComponent(kw));
    if (seq !== pcAcSeq) return;
    pcAcResults = (data.list || []).slice(0, 8);
    pcAcIndex = pcAcResults.length ? 0 : -1;
    pcAcRender();
  } catch (e) {
    if (seq === pcAcSeq) pcAcHide();
  }
}

function pcAcRender() {
  const box = document.getElementById("pc-name-ac");
  if (!box) return;
  if (!pcAcResults.length) {
    box.innerHTML = `<div class="ac-empty">配备目录中未找到匹配项，可继续手动输入</div>`;
  } else {
    box.innerHTML = pcAcResults.map((it, i) => `
      <div class="ac-item ${i === pcAcIndex ? "active" : ""}" data-idx="${i}">
        <div class="ac-name">${esc(it.name)}</div>
        <div class="ac-meta">${esc([it.subject, it.spec].filter(Boolean).join(" · ") || "仪器配备目录")}</div>
        <div class="ac-code">分类代码：${esc(it.code || "未填写")}</div>
      </div>`).join("");
  }
  box.classList.add("show");
}

function pcAcMove(step) {
  if (!pcAcResults.length) return;
  pcAcIndex = (pcAcIndex + step + pcAcResults.length) % pcAcResults.length;
  pcAcRender();
  const active = document.querySelector("#pc-name-ac .ac-item.active");
  if (active) active.scrollIntoView({ block: "nearest" });
}

function pcAcSelect(i) {
  const it = pcAcResults[i];
  if (!it) return;
  const nameEl = document.getElementById("pc-name");
  const codeEl = document.getElementById("pc-code");
  nameEl.value = it.name || "";
  codeEl.value = it.code || "";
  pcPickedName = nameEl.value;
  pcAutoCode = codeEl.value;
  pcAcHide();
  pcHint(it.code ? "已匹配配备目录，分类代码已自动填充" : "该目录条目未填写分类代码，可手动补充");
  nameEl.focus();
}

function pcAcHide() {
  const box = document.getElementById("pc-name-ac");
  if (box) box.classList.remove("show");
  pcAcIndex = -1;
}

function pcHint(text) {
  const el = document.getElementById("pc-name-hint");
  if (el) el.textContent = text;
}

async function changeStatus(id, status) {
  await api(`/api/purchases/${id}`, { method: "PUT", body: { status } });
  toast("状态已更新"); loadList();
}

function openReview(id, status) {
  openModal(status === "已审批" ? "审批通过" : "驳回申请", `
    <div class="form-group"><label>审批意见</label><textarea id="pv-comment"></textarea></div>
  `, { onOk: async () => {
    await api(`/api/purchases/${id}`, { method: "PUT", body: { status, review_comment: formVal("pv-comment") } });
    toast("操作完成"); closeModal(); loadList();
  }});
}

function del(id) {
  openModal("确认删除", `<p>确定删除该采购申请吗？</p>`, { onOk: async () => {
    await api(`/api/purchases/${id}`, { method: "DELETE" });
    toast("删除成功"); closeModal(); loadList();
  }});
}

function openReceive(r) {
  openModal("入库到仪器台账", `
    <p style="margin-bottom:12px;color:var(--text-muted)">将把以下采购仪器入库：</p>
    <div class="form-group"><label>仪器名称</label><input type="text" value="${esc(r.instrument_name)}" disabled></div>
    <div class="form-row">
      <div class="form-group" style="flex:1"><label>型号</label><input type="text" value="${esc(r.model || '-')}" disabled></div>
      <div class="form-group" style="flex:1"><label>数量</label><input type="text" value="${r.quantity}" disabled></div>
      <div class="form-group" style="flex:1"><label>预算(元)</label><input type="text" value="${r.budget ?? 0}" disabled></div>
    </div>
    <div class="form-group"><label>存放位置（选填）</label><input type="text" id="rv-loc" placeholder="如：生物实验室A-101柜"></div>
    <div class="form-group"><label>入库备注（选填）</label><textarea id="rv-remark" rows="2"></textarea></div>
  `, { onOk: async () => {
    const body = { location: formVal("rv-loc"), remark: formVal("rv-remark") };
    const res = await api(`/api/purchases/${r.id}/receive`, { method: "PUT", body });
    toast(`入库成功，自动编号：${res.instrument_code}`); closeModal(); loadList();
  }});
}
</script>
{% endblock %}
