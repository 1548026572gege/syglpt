<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 生物实验室管理平台</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">🧬</div>
    <h1>生物实验室管理平台</h1>
    <div class="sub">仪器台账 · 实验预约 · 借用维修 · 实验报告</div>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="login-username" placeholder="请输入账号" autocomplete="username">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="login-password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button class="btn btn-primary login-btn" id="login-btn">登 录</button>
  </div>

<script src="/static/js/api.js?v=2"></script>
<script>
if (getToken()) location.href = "/page/dashboard";
async function doLogin() {
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value;
  if (!username || !password) { toast("请输入账号和密码", "error"); return; }
  const btn = document.getElementById("login-btn");
  btn.disabled = true; btn.textContent = "登录中…";
  try {
    const resp = await fetch("/api/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await resp.json();
    if (!resp.ok || data.code !== 0) { toast(data.msg || "登录失败", "error"); return; }
    localStorage.setItem(TOKEN_KEY, data.data.token);
    localStorage.setItem(USER_KEY, JSON.stringify(data.data.user));
    location.href = "/page/dashboard";
  } catch (e) {
    toast("网络异常，请稍后重试", "error");
  } finally {
    btn.disabled = false; btn.textContent = "登 录";
  }
}
document.getElementById("login-btn").onclick = doLogin;
document.addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
